<?xml version="1.0" encoding="utf-8"?>
<!--
  Tomo's small-format kitsune mark. Stripped from the full identity logo
  (which carries the hi-no-maru disc and the 友 kanji) so it reads cleanly
  at 16-20px in inline copy. The full mark stays canonical at masthead
  sizes; this glyph is the "Tomo is present" signature on ambient surfaces.

  Single path, fill="currentColor" so the consumer chooses the hue. The
  silhouette is a curled fox seen front-on: triangular face, two pointed
  ears, two tails arcing behind. Sumi-brush weight, no fine detail.
-->
