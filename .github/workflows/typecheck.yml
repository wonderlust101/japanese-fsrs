name: typecheck

# Catches code drift: services or components that don't match the committed
# apps/api/src/db/database.types.ts. The committed types are used as-is here.
#
# Schema drift (committed types vs the actual migrations) is caught separately
# by the drift sentinel in integration.yml, which regenerates the type from a
# locally-migrated DB (`bun run db:types`, now --local) and fails on any diff.
# CI no longer regenerates from a hardcoded remote project — that was the blind
# spot that let migration ≠ types drift (audit C2) ship undetected.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      # SHAs pinned per security audit FIND-DEP-06 — Dependabot keeps them current.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
