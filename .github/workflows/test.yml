name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # SHAs pinned per security audit FIND-DEP-06 — Dependabot keeps them current.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5    # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6   # v2
      - run: bun install --frozen-lockfile

      # Runs the unit + schema suites (apps/api + packages/shared-types). The
      # integration tier (apps/api/tests/integration) self-skips here: it gates
      # on a real SUPABASE_URL via tests/integration/_helpers.ts, and none is
      # set in this job, so describeIntegration becomes describe.skip. Wiring a
      # Supabase service into CI so those suites run is Phase 2 of the test plan.
      - name: Run tests
        run: bun test
