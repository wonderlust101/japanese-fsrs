name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Typecheck ─────────────────────────────────────────────────────────────
  # Cascades into both workspaces via the root `typecheck` script
  # (`bun run --filter '*' typecheck`).
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  # ── Lint ──────────────────────────────────────────────────────────────────
  # Flat ESLint config (@antfu/eslint-config) over the whole monorepo.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  # ── Web tests (Vitest, jsdom) ─────────────────────────────────────────────
  # Runs the apps/web Vitest suite with v8 coverage. The lcov + html
  # reports upload as an artifact for review on the run page.
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run web Vitest suite with coverage
        run: bun --filter @fsrs-japanese/web test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 7

  # ── API unit tests (bun:test) ─────────────────────────────────────────────
  # Restricted to `src/` (fast, no external services). The integration tier
  # (apps/api/tests/integration) runs separately in `integration.yml`, which
  # boots a real Supabase + Upstash-REST shim on pull_request / push to main
  # and also runs the schema-drift + function-body schema guards.
  api-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run API unit tests with coverage
        run: bun --filter @fsrs-japanese/api test:coverage
      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7
      # bun's own coverageThreshold can't express an aggregate gate (see
      # apps/api/bunfig.toml); this checks the weighted lcov line %.
      - name: API coverage gate
        run: bun --filter @fsrs-japanese/api coverage:gate
