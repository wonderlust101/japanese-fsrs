name: integration

# Runs the gated integration tier (apps/api/tests/integration) against a real
# local Supabase stack plus an Upstash-REST-compatible Redis shim. These suites
# self-skip in the plain `test` workflow (no real SUPABASE_URL); here they run.
#
# Requirements to go fully green:
#   - secrets.OPENAI_API_KEY — the embedding / AI-dispatch suites call OpenAI.
#     Without it those specific tests fail with a 503 (breaker), not a crash.
#
# (The update_deck / dropped `is_premade_fork` 42703 was fixed in
#  20260705000000_fix_update_deck_drop_premade_fork.sql; the deck If-Match suite
#  is no longer expected red. The "Function-body schema lint" step below now
#  guards that whole class of dropped-column regression.)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      # Real Redis behind an Upstash-REST shim — the app talks @upstash/redis,
      # and the Supabase circuit breaker reads/writes Redis on every DB call.
      redis:
        image: redis:7-alpine
      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: test-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    steps:
      # SHAs pinned per security audit FIND-DEP-06 — Dependabot keeps them current.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Local Supabase: Postgres + GoTrue + PostgREST + Kong, with all
      # migrations applied. Docker is available on ubuntu-latest runners.
      - name: Start Supabase
        run: bunx supabase start

      # Schema drift sentinel (audit C2): regenerate the Database type from the
      # locally-migrated DB and fail if it differs from the committed file. This
      # is what makes the committed migrations the single source of truth — a
      # hand-edit on the remote (the mechanism that hid the C1 42703 bug) can no
      # longer diverge silently, because the committed types must match a
      # migrations-only rebuild.
      - name: Schema drift sentinel
        run: |
          bun run db:types
          git diff --exit-code apps/api/src/db/database.types.ts \
            || { echo "::error::database.types.ts is out of sync with the committed migrations. Run 'bun run db:types' locally and commit the result."; exit 1; }

      # Function-body schema guard (audit H1). The drift sentinel above only
      # compares generated *types* — function signatures and table shapes. A
      # plpgsql function whose BODY references a dropped column is late-bound:
      # CREATE OR REPLACE accepts it and it only throws 42703 at call time, so
      # it sails past the type diff. Three such stragglers shipped reactively
      # (20260613 list_decks, 20260705 update_deck, 20260708 drill/copy_card)
      # before this guard existed. `supabase db lint` runs plpgsql_check over
      # every public function body and fails on any error-level finding.
      - name: Function-body schema lint
        run: bun run db:lint

      - name: Run integration tests
        env:
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
          UPSTASH_REDIS_REST_TOKEN: test-token
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          eval "$(bunx supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          bun test apps/api/tests/integration/ apps/api/tests/e2e/

      - name: Stop Supabase
        if: always()
        run: bunx supabase stop
