name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # SHAs pinned per security audit FIND-DEP-06 — Dependabot keeps them current.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Flat ESLint config (@antfu/eslint-config) over the whole monorepo.
      # Fails on errors only; advisory warnings (react-hooks/exhaustive-deps,
      # react/set-state-in-effect, …) do not fail the build.
      - name: Lint
        run: bun run lint
