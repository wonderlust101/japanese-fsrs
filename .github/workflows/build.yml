name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # SHAs pinned per security audit FIND-DEP-06 — Dependabot keeps them current.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Production build for both apps: `next build` (web) + `bun build` (api).
      # Catches build-only breakage that typecheck and tests miss.
      #
      # `next build` evaluates apps/web/lib/env.ts (Zod-validated NEXT_PUBLIC_*
      # vars) during prerender. These are build-check placeholders with valid
      # shapes — this workflow verifies compilation only and ships nothing.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: bun run build

      # First Load JS budget — fails the PR if the web client bundle regresses
      # past apps/web/.size-limit.json. Reuses the build output produced above
      # (no second build). Catches dev/fixture/heavy-dep leakage into prod chunks.
      - name: Size budget
        run: bun run --filter @fsrs-japanese/web size
